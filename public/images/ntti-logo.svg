<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">National Technical Training Institute Logo</title>
  <desc id="desc">Round NTTI school seal inspired by the National Technical Training Institute emblem.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff176"/>
      <stop offset=".48" stop-color="#f4c430"/>
      <stop offset="1" stop-color="#b7791f"/>
    </linearGradient>
    <linearGradient id="torch" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffef7a"/>
      <stop offset=".45" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#111827" flood-opacity=".28"/>
    </filter>
  </defs>
  <circle cx="120" cy="120" r="110" fill="#fffef2" filter="url(#shadow)"/>
  <circle cx="120" cy="120" r="105" fill="url(#gold)"/>
  <circle cx="120" cy="120" r="86" fill="#fffef8" stroke="#111827" stroke-width="2"/>
  <path d="M42 119a78 78 0 0 1 156 0" fill="none" stroke="#111827" stroke-width="1.5"/>
  <text x="120" y="38" text-anchor="middle" font-family="Noto Sans Khmer, Arial, sans-serif" font-size="13" font-weight="700" fill="#12312f">វិទ្យាស្ថានជាតិបណ្តុះបណ្តាលបច្ចេកទេស</text>
  <text x="120" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" fill="#12312f">NATIONAL TECHNICAL TRAINING INSTITUTE</text>
  <g transform="translate(0 2)">
    <path d="M119 43c11 10 17 19 17 30 0 12-7 21-16 26-10-5-16-14-16-26 0-10 5-20 15-30z" fill="url(#torch)" stroke="#7c2d12" stroke-width="3"/>
    <path d="M119 55c5 6 8 11 8 18s-3 12-8 16c-5-4-8-9-8-16s3-12 8-18z" fill="#fff7ad" stroke="#92400e" stroke-width="2"/>
    <rect x="96" y="99" width="48" height="12" rx="2" fill="#7c2d12"/>
    <rect x="103" y="111" width="34" height="54" rx="3" fill="url(#torch)" stroke="#7c2d12" stroke-width="3"/>
    <path d="M109 116h22M109 128h22M109 140h22M109 152h22" stroke="#7c2d12" stroke-width="2"/>
    <path d="M85 171h70l-8 19H93z" fill="#ef4444" stroke="#991b1b" stroke-width="3"/>
    <text x="120" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">NTI</text>
  </g>
  <g fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 154l19-52 19 52M70 132h22"/>
    <path d="M158 154l21-52 21 52M166 132h26"/>
    <circle cx="55" cy="155" r="8"/>
    <path d="M47 155h-12M63 155h12"/>
    <circle cx="198" cy="155" r="8"/>
    <path d="M190 155h-12M206 155h12"/>
  </g>
  <path d="M67 143l36 7-3 22-39-7z" fill="#16a34a" stroke="#166534" stroke-width="3"/>
  <path d="M69 151h29M66 160h31" stroke="#ffffff" stroke-width="3"/>
  <circle cx="120" cy="120" r="105" fill="none" stroke="#111827" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#ffffff" stroke-width="5"/>
